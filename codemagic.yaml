workflows:
  zan-gi-android-apk:
    name: Zan-Gi Android APK
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      java: 17

    scripts:
      - name: Build Android debug APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
