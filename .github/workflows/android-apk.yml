name: Zan-Gi Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Zan-Gi APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: android

      - name: Setup Android SDK Environment
        run: |
          # Remove any stale machine-specific local.properties
          rm -f android/local.properties
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" >> $GITHUB_ENV
          yes | sdkmanager --licenses || true

      - name: Build Debug APK
        shell: bash
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew :app:compileDebugKotlin --stacktrace
          ./gradlew :app:assembleDebug --stacktrace

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Zan-Gi-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Diagnostic Logs on Failure
        if: failure()
        run: |
          echo "=== Build failed. Gathering diagnostic logs ==="
          if [ -d "android/app/build/reports" ]; then
            find android/app/build/reports -type f \( -name "*.txt" -o -name "*.html" \) -exec head -n 100 {} + 2>/dev/null || true
          fi
